<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="app-base" content="__BASE__">
<title>梧桐河灌区 · 分布式灌溉配置</title>
<link rel="stylesheet" href="__BASE__/static/app.css?v=__V__">
<link rel="stylesheet" href="__BASE__/static/distributed.css?v=__V__-daily20261029">
</head>
<body>
<nav class="navbar"><div class="navbar-inner"><a class="brand" href="__BASE__/"><span class="dot">梧</span>梧桐河灌区</a><div class="nav-right"><a class="btn btn-sm" href="__BASE__/">单区作物生长模型</a><span class="pill" id="distStatus">加载中</span></div></div></nav>
<main class="container dist-container">
  <div class="dist-heading"><div><h1 class="page-title">分布式灌溉配置</h1><p class="page-desc">选择年份，点击格网查看各灌溉制度的产量、用水与逐日结果。</p></div><span class="pill">250 m 格网</span></div>
  <div id="distNotice" class="notice" role="status">正在读取预计算结果…</div>

  <div class="dist-layout">
    <section class="card dist-map-card">
      <div class="card-head"><h2>格网分布</h2></div>
      <div class="dist-map-toolbar">
        <select id="distFilter" aria-label="按作物筛选"><option value="all">全部</option><option value="rice">仅水稻</option><option value="corn">仅玉米</option></select>
        <label class="dist-search">格网 ID<input id="distGridSearch" placeholder="wth250_2525_20915"><button class="btn btn-sm" id="distLocate">查询</button></label>
      </div>
      <div class="dist-map-wrap"><canvas id="distMap" role="img" aria-label="梧桐河灌区可点击格网地图"></canvas><div class="dist-map-caption">N ↑ · 点击格网查询</div></div>
      <div class="dist-legend" id="distLegend"></div><div class="dist-map-foot" id="distMapStats"></div>
    </section>

    <aside class="dist-controls">
      <section class="card">
        <div class="card-head"><h2>年份</h2></div>
        <div class="card-body">
          <div class="field"><select id="distYear" aria-label="计算年份"></select></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h2>分制度汇总</h2><span class="sub" id="distSumSub"></span></div>
        <div class="card-body" id="distSummary"><div class="empty-state">加载中…</div></div>
      </section>

      <section class="card">
        <div class="card-head"><h2>数据</h2></div>
        <div class="card-body">
          <p class="hint" id="distBasis">—</p>
        </div>
      </section>
    </aside>

    <div class="dist-workspace">
      <section class="card">
        <div class="card-head"><h2>格网输入与结果</h2><span class="sub" id="distDetailTitle">点击地图查看</span></div>
        <div class="card-body" id="distDetail"><div class="empty-state">点击灌区中的一个格网。</div></div>
      </section>
    </div>
  </div>
</main>
<script src="__BASE__/static/common.js?v=__V__"></script><script src="__BASE__/static/auth.js?v=__V__"></script><script src="__BASE__/static/distributed.js?v=__V__-daily20261029"></script>
</body></html>
